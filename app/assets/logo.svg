<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield shape -->
  <path d="M100 10 L180 40 L180 110 Q180 160 100 190 Q20 160 20 110 L20 40 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner shield -->
  <path d="M100 25 L165 50 L165 108 Q165 148 100 172 Q35 148 35 108 L35 50 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- L lettermark -->
  <text x="100" y="120" text-anchor="middle" dominant-baseline="middle"
        fill="url(#shieldGrad)" font-family="monospace" font-size="72" font-weight="bold"
        filter="url(#glow)">L</text>

  <!-- Bottom text -->
  <text x="100" y="155" text-anchor="middle" dominant-baseline="middle"
        fill="#00ff88" font-family="monospace" font-size="14" letter-spacing="3" opacity="0.9">
    LASWITCH
  </text>
</svg>
